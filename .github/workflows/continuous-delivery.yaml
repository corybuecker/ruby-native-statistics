name: continuous-delivery

permissions:
  contents: read

on:
  push:
    branches:
      - main

concurrency:
  group: continuous-delivery
  cancel-in-progress: true

jobs:
  build:
    name: Run tests
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        with:
          ruby-version: 4.0.1
      - run: gem install bundler --no-document
      - run: bundle
      - run: rake native gem
      - if: ${{ matrix.os == 'ubuntu-latest' }}
        run: gem build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gem-${{ matrix.os }}
          path: |
            *.gem
            pkg/*.gem
